name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate activity parser and links
        run: npm test

      - name: Build site
        run: npm run build

      - name: Verify isolated production preview and PDF checksums
        run: npm run smoke

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify dashboard in browser
        run: npm run test:browser

      - name: Prepare site
        run: touch dist/.nojekyll

      - name: Record candidate commit and immutable artifact checksums
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Candidate commit: %s\n' "$CANDIDATE_SHA" > candidate.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum >> candidate.txt
          cat candidate.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/dist/
            app/candidate.txt
            app/test-results/
          include-hidden-files: true

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: app/test-results/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download verified candidate for production health checks
        uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: candidate

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production health and local certificates
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "$PAGE_URL" --output /dev/null
          find candidate/dist/certificates -type f -name '*.pdf' -print0 | while IFS= read -r -d '' file; do
            curl --fail --retry 5 --retry-delay 5 "${PAGE_URL}${file#candidate/dist/}" --output /dev/null
          done
